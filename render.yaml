services:
  - type: web
    name: sepp-sessions-backend
    runtime: python
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SEPP_CLOUD_MODE
        value: "1"
      - key: SEPP_DATABASE_URL
        fromDatabase:
          name: sepp-sessions-db
          property: connectionString
      - key: SEPP_SECRET_KEY
        generateValue: true
      - key: SEPP_ADMIN_ID
        sync: false
      - key: SEPP_ADMIN_PASSWORD_HASH
        sync: false
databases:
  - name: sepp-sessions-db
    databaseName: sepp_sessions
